name: Report an Aikya bug
description: Report a problem in the harness, agents, skills or project generators
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include passwords, access tokens, cloud secrets or personal data.
        For vulnerabilities, follow SECURITY.md and report privately.
  - type: dropdown
    id: project_type
    attributes:
      label: Aikya project type or scope
      options:
        - Development
        - Infrastructure (Terraform/OpenTofu/Ansible)
        - DevOps (Docker/Compose/Kubernetes)
        - Global or project installation
        - Engineering agents or skills
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Aikya version or commit
      description: Branch and commit or version used. Do not include credentials.
      placeholder: 'develop @ <SHA>'
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system / Python / Claude Code
      placeholder: Ubuntu 24.04 / Python 3.11 / Claude Code
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the Aikya command or procedure and a minimal secret-free profile.
      placeholder: |
        1. Selected project_type=...
        2. Ran /aikya-...
        3. Observed the failure ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove private paths, credentials, cloud secrets and personal data.
      render: shell
