name: Aikya | Python tests

on:
  push:
    branches: [develop, main, 'feat/**', 'fix/**', 'release/**']
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aikya-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    name: Unit tests | Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Python syntax checks
        run: |
          python -m compileall -q \
            aikya_cli.py aikya_layout.py aikya_requirements.py \
            aikya_session.py aikya_setup.py doc_bootstrap.py \
            engineering_catalog.py external_skills.py \
            infrastructure_profile.py install.py skills_registry.py \
            template/scripts/harness scripts/ci

      - name: Run Aikya regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
