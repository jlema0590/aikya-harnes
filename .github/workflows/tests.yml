name: Aikya | Python tests

on:
  push:
    branches: [develop, main, 'feat/**', 'fix/**', 'release/**']
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aikya-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    name: Unit tests | Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Python syntax checks
        run: |
          python -m compileall -q \
            aikya_cli.py aikya_layout.py aikya_requirements.py \
            aikya_session.py aikya_setup.py doc_bootstrap.py \
            engineering_catalog.py external_skills.py \
            infrastructure_profile.py install.py skills_registry.py sdd_engine.py sdd_assets.py sdd_localization.py sdd_templates.py claude_templates.py documentation_templates.py documentation_workflows.py \
            docs_language.py docs_templates_en.py docs_templates_es.py \
            docs_layout.py docs_migration_hashes.py methodology.py odd_engine.py \
            command_workflows.py execution_state.py execution_observer.py execution_config.py \
            execution_lifecycle.py check_events.py runtime_metrics.py aikya_statusline.py aikya_subagent_statusline.py \
            template/scripts/harness scripts/ci

      - name: Validate bundled Claude Code agents and Agent Skills
        run: python scripts/ci/validate_agent_assets.py

      - name: Validate pinned documentation templates
        run: python documentation_templates.py check

      - name: Run Aikya regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
